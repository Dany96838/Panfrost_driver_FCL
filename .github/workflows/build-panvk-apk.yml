name: Build PanVK FCL APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PanVK_FCL_Plugin_Experimental/**'
      - '.github/workflows/build-panvk-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify PanVK binary is present
        run: |
          LIB="PanVK_FCL_Plugin_Experimental/app/src/main/jniLibs/arm64-v8a/libvulkan_panfrost.so"
          if [ ! -s "$LIB" ]; then
            echo "::error::Missing PanVK binary. Add the supplied libvulkan_panfrost.so at $LIB before building."
            exit 1
          fi
          echo "Binary SHA-256:"
          sha256sum "$LIB"
          echo "Expected: 62c2b3f98ca987d5ab50b6f01e2d2c1c5b3ee995fe93666aa5da9415f65c3348"
          echo "Actual:"
          sha256sum "$LIB" | cut -d' ' -f1 | grep -Fx '62c2b3f98ca987d5ab50b6f01e2d2c1c5b3ee995fe93666aa5da9415f65c3348'

      - name: Build signed debug APK
        working-directory: PanVK_FCL_Plugin_Experimental
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and print SHA-256
        run: |
          APK="PanVK_FCL_Plugin_Experimental/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-FCL-1.3.4.5-experimental-APK
          path: PanVK_FCL_Plugin_Experimental/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
