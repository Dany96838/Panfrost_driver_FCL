name: Build PanVK FCL APK

on:
  workflow_dispatch:
  push:
    # Avoid wasting a run when only project metadata/workflow files change.
    # Uploading the verified native library starts the build automatically.
    paths:
      - 'PanVK_FCL_Plugin_Experimental/app/src/main/jniLibs/arm64-v8a/libvulkan_panfrost.so'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35 and build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35,build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify PanVK binary
        run: |
          set -euo pipefail
          LIB="PanVK_FCL_Plugin_Experimental/app/src/main/jniLibs/arm64-v8a/libvulkan_panfrost.so"
          test -s "$LIB" || { echo "::error::Missing PanVK binary: $LIB"; exit 1; }
          ACTUAL="$(sha256sum "$LIB" | cut -d' ' -f1)"
          EXPECTED="62c2b3f98ca987d5ab50b6f01e2d2c1c5b3ee995fe93666aa5da9415f65c3348"
          echo "PanVK SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::PanVK SHA-256 mismatch"; exit 1; }
          readelf -h "$LIB" | grep -E 'Class:.*ELF64|Machine:.*AArch64'

      - name: Build Android plugin APK
        working-directory: PanVK_FCL_Plugin_Experimental
        run: gradle --no-daemon :app:assembleRelease

      - name: Generate one-time random signing key
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 32)"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/panvk-one-time-signing.jks" \
            -storepass "$PASS" -keypass "$PASS" \
            -alias panvk -dname "CN=PanVK FCL Experimental" \
            -keyalg RSA -keysize 3072 -validity 2
          echo "APK_SIGNING_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Sign APK with temporary key and verify
        run: |
          set -euo pipefail
          APK="PanVK_FCL_Plugin_Experimental/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="$RUNNER_TEMP/PanVK-FCL-1.3.4.5-experimental.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/panvk-one-time-signing.jks" \
            --ks-key-alias panvk \
            --ks-pass env:APK_SIGNING_PASSWORD \
            --key-pass env:APK_SIGNING_PASSWORD \
            --out "$OUT" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          sha256sum "$OUT"
          rm -f "$RUNNER_TEMP/panvk-one-time-signing.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-FCL-1.3.4.5-experimental-APK-attempt-${{ matrix.attempt }}
          path: ${{ runner.temp }}/PanVK-FCL-1.3.4.5-experimental.apk
          if-no-files-found: error
          retention-days: 14
