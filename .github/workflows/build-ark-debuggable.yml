name: Build ARK debuggable APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check input APK
        run: |
          test -f ARK/ark-original.apk || {
            echo "Missing ARK/ark-original.apk"
            exit 1
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Install Apktool
        run: |
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          printf '#!/bin/sh\nexec java -jar "$GITHUB_WORKSPACE/apktool.jar" "$@"\n' > apktool
          chmod +x apktool
          sudo mv apktool /usr/local/bin/apktool

      - name: Decode and enable debuggable
        run: |
          apktool d -f ARK/ark-original.apk -o decoded
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = "decoded/AndroidManifest.xml"
          tree = ET.parse(p)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("No <application> element in manifest")
          app.set(ns + "debuggable", "true")
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY
          apktool b decoded -o ark-unsigned.apk

      - name: Align APK
        run: "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 ark-unsigned.apk ark-aligned.apk

      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore ark-debug.keystore -storepass changeit -keypass changeit -alias arkdebug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ARK Debug Build, OU=Local, O=Local, L=NA, S=NA, C=US"

      - name: Sign APK v2/v3
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks ark-debug.keystore --ks-key-alias arkdebug --ks-pass pass:changeit --key-pass pass:changeit --v2-signing-enabled true --v3-signing-enabled true --out ARK_Legacy_debuggable.apk ark-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ARK_Legacy_debuggable.apk
          apktool d -f ARK_Legacy_debuggable.apk -o verify-decoded
          grep -q 'android:debuggable="true"' verify-decoded/AndroidManifest.xml

      - uses: actions/upload-artifact@v4
        with:
          name: ark-debuggable-signed
          path: ARK_Legacy_debuggable.apk
          if-no-files-found: error
